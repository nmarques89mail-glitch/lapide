
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lapide 3D</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
      background: transparent;
      --poster-color: transparent;
    }
  
    #garden {position:absolute;left:16%;right:16%;bottom:12%;height:20%;pointer-events:none;}
    .flower {position:absolute;width:clamp(26px,5vw,64px);image-rendering:pixelated;transform-origin:50% 95%;filter:drop-shadow(1px 3px 2px #0008);}
    .flower.fresh {animation:drop .55s ease-out;}
    @keyframes drop {from{opacity:0;translate:0 -24px;}to{opacity:1;translate:0 0;}}
    #controls {position:absolute;bottom:2%;left:0;right:0;text-align:center;color:white;font:12px Arial,sans-serif;pointer-events:none;}
    #leave {pointer-events:auto;background:#111a;color:white;border:1px solid white;padding:14px 30px;font:700 15px Arial,sans-serif;letter-spacing:.08em;cursor:pointer;}
    #leave:hover:not(:disabled) {background:white;color:black;}
    #leave:disabled {opacity:.65;cursor:default;}
    #count {margin:8px 0 0;}
    @media(prefers-reduced-motion:reduce){.flower.fresh{animation:none;}}
  </style>
</head>

<body>

  <model-viewer
    src="LAPIDE-v1.glb"
    camera-controls
    disable-zoom
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="15deg"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral">
  </model-viewer>


  <div id="garden" aria-hidden="true"></div>
  <div id="controls">
    <button type="button" id="leave" disabled>DEIXA UMA FLOR</button>
    <p id="count" role="status">A carregar as flores…</p>
  </div>

    async function refresh(){
      if(busy||loading)return;
      loading=true;
      try{render(await rpc("get_flowers"));button.disabled=false;}
      catch(e){if(shown<0)count.textContent="Flores temporariamente indisponíveis.";}
      finally{loading=false;}
    }
    button.addEventListener("click",async()=>{
      if(busy||loading)return;
      busy=true;button.disabled=true;
      try{await rpc("leave_flower");button.textContent="OBRIGADO";render(await rpc("get_flowers"),true);}
      catch(e){button.textContent="VERIFICA A LIGAÇÃO";count.textContent="Não foi possível confirmar a flor. Atualiza a página para verificar.";}
      finally{setTimeout(()=>{busy=false;button.disabled=false;button.textContent="DEIXA UMA FLOR";refresh();},2000);}
    });
    refresh();
    setInterval(()=>{if(!document.hidden)refresh();},30000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});
